[project]
name = "cidr-range-merge"
version = "0.1.2"
description = "Combine adjacent and overlapping IPv4/IPv6 CIDR blocks into the minimal covering set using pure-Python integer arithmetic."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
